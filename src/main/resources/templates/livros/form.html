
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livro | BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}">
</head>
<body>

<h1 th:text="${livro.id == null ? 'Novo livro' : 'Editar livro'}">
    Novo livro
</h1>

<form class="formulario"
      th:action="@{/livros}"
      th:object="${livro}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div class="erro" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="erro : ${#fields.globalErrors()}"
           th:text="${erro}"></p>
    </div>

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" th:field="*{titulo}">
    <p class="erro" th:errors="*{titulo}"></p>

    <label for="autor">Autor:</label>
    <input type="text" id="autor" th:field="*{autor}">
    <p class="erro" th:errors="*{autor}"></p>

    <label for="isbn">ISBN (13 dígitos):</label>
    <input type="text" id="isbn" th:field="*{isbn}"
           maxlength="13">
    <p class="erro" th:errors="*{isbn}"></p>

    <label for="anoPublicacao">Ano de publicação:</label>
    <input type="number" id="anoPublicacao"
           th:field="*{anoPublicacao}">
    <p class="erro" th:errors="*{anoPublicacao}"></p>

    <label for="quantidadeTotal">Quantidade total:</label>
    <input type="number" id="quantidadeTotal"
           th:field="*{quantidadeTotal}" min="1">
    <p class="erro" th:errors="*{quantidadeTotal}"></p>

    <label for="categoria">Categoria:</label>
    <select id="categoria" th:field="*{categoria.id}">
        <option value="">Selecione uma categoria</option>
        <option th:each="categoria : ${categorias}"
                th:value="${categoria.id}"
                th:text="${categoria.nome}">
        </option>
    </select>

    <div class="acoes">
        <button type="submit" class="botao">Salvar</button>
        <a class="botao botao-secundario"
           th:href="@{/livros}">
            Cancelar
        </a>
    </div>

</form>

</body>
</html>
